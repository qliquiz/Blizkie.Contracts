version: v1
plugins:
  # Go
  - name: go
    out: gen/go
    opt: paths=source_relative

  - name: connect-go
    out: gen/go
    opt: paths=source_relative

  # C#
  - name: csharp
    out: gen/csharp

  # TS
  - name: es
    path: ./node_modules/.bin/protoc-gen-es
    out: gen/ts
    opt: target=ts

  - name: connect-es
    path: ./node_modules/.bin/protoc-gen-connect-es
    out: gen/ts
    opt: target=ts