version: v1
managed:
  enabled: true
plugins:
  # === Go (Auth & Messenger) ===
  - plugin: buf.build/protocolbuffers/go:v1.34.1
    out: gen/go
    opt: paths=source_relative
  - plugin: buf.build/connectrpc/go:v1.16.1
    out: gen/go
    opt: paths=source_relative

  # === C# (Core Service) ===
  - plugin: buf.build/protocolbuffers/csharp:v26.1
    out: gen/csharp
  - plugin: buf.build/grpc/csharp:v1.62.0
    out: gen/csharp

  # === TypeScript (React Native) ===
  - plugin: buf.build/bufbuild/es:v1.9.0
    out: gen/ts
    opt: target=ts
  - plugin: buf.build/connectrpc/es:v1.4.0
    out: gen/ts
    opt: target=ts