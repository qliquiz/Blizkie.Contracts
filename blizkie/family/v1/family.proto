syntax = "proto3";

package blizkie.family.v1;

import "google/api/annotations.proto";

option go_package = "github.com/qliquiz/Blizkie.Contracts/gen/go/blizkie/family/v1;familyv1";

service FamilyService {
  rpc CreateFamily(CreateFamilyRequest) returns (CreateFamilyResponse) {
    option (google.api.http) = {
      post: "/api/v1/families"
      body: "*"
    };
  }
  
  rpc GetMyFamily(GetMyFamilyRequest) returns (GetMyFamilyResponse) {
    option (google.api.http) = {
      get: "/api/v1/families/my"
    };
  }
  
  rpc GenerateInviteCode(GenerateInviteCodeRequest) returns (GenerateInviteCodeResponse) {
    option (google.api.http) = {
      post: "/api/v1/families/{family_id}/invite-code"
    };
  }

  rpc JoinFamily(JoinFamilyRequest) returns (JoinFamilyResponse) {
    option (google.api.http) = {
      post: "/api/v1/families/join"
      body: "*"
    };
  }

  rpc LeaveFamily(LeaveFamilyRequest) returns (LeaveFamilyResponse) {
    option (google.api.http) = {
      delete: "/api/v1/families/{family_id}/leave"
    };
  }

  rpc KickMember(KickMemberRequest) returns (KickMemberResponse) {
    option (google.api.http) = {
      delete: "/api/v1/families/{family_id}/members/{user_id_to_kick}"
    };
  }

  rpc ChangeMemberRole(ChangeMemberRoleRequest) returns (ChangeMemberRoleResponse) {
    option (google.api.http) = {
      patch: "/api/v1/families/{family_id}/members/{target_user_id}/role"
      body: "*"
    };
  }

  rpc ChangeDisplayName(ChangeDisplayNameRequest) returns (ChangeDisplayNameResponse) {
    option (google.api.http) = {
      patch: "/api/v1/families/{family_id}/members/me/display-name"
      body: "*"
    };
  }

  rpc UpdateFamilyName(UpdateFamilyNameRequest) returns (UpdateFamilyNameResponse) {
    option (google.api.http) = {
      patch: "/api/v1/families/{family_id}"
      body: "*"
    };
  }

  rpc DeleteFamily(DeleteFamilyRequest) returns (DeleteFamilyResponse) {
    option (google.api.http) = {
      delete: "/api/v1/families/{family_id}"
    };
  }

  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse) {
    option (google.api.http) = {
      delete: "/api/v1/families/invites/{code}"
    };
  }
}

enum FamilyRole {
  FAMILY_ROLE_UNSPECIFIED = 0;
  FAMILY_ROLE_OWNER = 1;
  FAMILY_ROLE_ADULT = 2;
  FAMILY_ROLE_CHILD = 3;
}

message CreateFamilyRequest {
  string family_name = 1;
  // user_id здесь нет, берётся из JWT токена
}

message CreateFamilyResponse {
  string family_id = 1;
}

message GetMyFamilyRequest {
  // пустой запрос. опять же, кто просит - узнаем из токена
}

message GetMyFamilyResponse {
  string family_id = 1;
  string name = 2;
  repeated Member members = 3; // массив участников
}

message Member {
  string user_id = 1;
  string display_name = 2;
  FamilyRole role = 3;
}

message GenerateInviteCodeRequest {
  string family_id = 1;
}

message GenerateInviteCodeResponse {
  string code = 1;
}

message JoinFamilyRequest {
  string code = 1;
}

message JoinFamilyResponse {
  string family_id = 1;
}

message LeaveFamilyRequest {
  string family_id = 1;
}

message LeaveFamilyResponse {
  string message = 1;
}

message KickMemberRequest {
  string family_id = 1;
  string user_id_to_kick = 2;
}

message KickMemberResponse {
  string message = 1;
}

message ChangeMemberRoleRequest {
  string family_id = 1;
  string target_user_id = 2;
  FamilyRole role = 3;
}

message ChangeMemberRoleResponse {
  string message = 1;
}

message ChangeDisplayNameRequest {
  string family_id = 1;
  string display_name = 2;
}

message ChangeDisplayNameResponse {
  string message = 1;
}

message UpdateFamilyNameRequest {
  string family_id = 1;
  string name = 2;
}

message UpdateFamilyNameResponse {
  string message = 1;
}

message DeleteFamilyRequest {
  string family_id = 1;
}

message DeleteFamilyResponse {
  string message = 1;
}

message RevokeInviteRequest {
  string code = 1;
}

message RevokeInviteResponse {
  string message = 1;
}
