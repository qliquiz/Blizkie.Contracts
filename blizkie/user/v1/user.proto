syntax = "proto3";

package blizkie.user.v1;

import "google/api/annotations.proto";

option go_package = "github.com/qliquiz/Blizkie.Contracts/gen/go/blizkie/user/v1;userv1";

service UserService {
  rpc SyncUser(SyncUserRequest) returns (SyncUserResponse) {
    option (google.api.http) = {
      post: "/api/internal/users/sync"
      body: "*"
    };
  }

  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse) {
    option (google.api.http) = {
      patch: "/api/v1/users/me/profile"
      body: "*"
    };
  }
}

message SyncUserRequest {
  string user_id = 1;
  optional string phone = 2;
  optional string email = 3;
  string name = 4;
}

message SyncUserResponse {
  string message = 1;
}

message UpdateProfileRequest {
  string name = 1;
  string avatar_url = 2;
}

message UpdateProfileResponse {
  string message = 1;
}
